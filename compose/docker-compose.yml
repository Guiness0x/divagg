services:

  divagg-db:
    build:
      context: ..
      dockerfile: containers/db/Dockerfile

    env_file:
      - ../.env

    container_name: divagg-db

    environment:
      POSTGRES_DB: divagg
      POSTGRES_USER: divagg
      POSTGRES_PASSWORD: divagg_runtime

    volumes:
      - ../runtime/postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - divagg-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divagg"]
      interval: 10s
      timeout: 5s
      retries: 5

  divagg-core:
    build:
      context: ..
      dockerfile: containers/core/Dockerfile

    env_file:
      - ../.env

    container_name: divagg-core

    environment:
      POSTGRES_HOST: divagg-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: divagg
      POSTGRES_USER: divagg
      POSTGRES_PASSWORD: divagg_runtime
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}

    depends_on:
      divagg-db:
        condition: service_healthy

    volumes:
      - ../runtime:/runtime
      - ../data:/data

    working_dir: /runtime

    stdin_open: true
    tty: true

    networks:
      - divagg-net

  divagg-backup:
    build:
      context: ..
      dockerfile: containers/backup/Dockerfile

    env_file:
      - ../.env

    container_name: divagg-backup

    depends_on:
      divagg-db:
        condition: service_healthy

    volumes:
      - ../runtime:/runtime
      - ../backups:/backups

    working_dir: /runtime

    stdin_open: true
    tty: true

    networks:
      - divagg-net

  divagg-telemetry:
    build:
      context: ..
      dockerfile: containers/telemetry/Dockerfile

    env_file:
      - ../.env

    container_name: divagg-telemetry

    depends_on:
      divagg-db:
        condition: service_healthy

    environment:
      POSTGRES_HOST: divagg-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: divagg
      POSTGRES_USER: divagg
      POSTGRES_PASSWORD: divagg_runtime

    volumes:
      - ../runtime:/runtime

    working_dir: /runtime

    stdin_open: true
    tty: true

    networks:
      - divagg-net

networks:
  divagg-net:
    driver: bridge
